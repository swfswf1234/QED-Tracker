[alembic]
script_location = %(here)s/src/qed_tracker/migrations
prepend_sys_path = %(here)s/src
path_separator = os
# sqlalchemy.url is NOT set here: built from QED_DB_* env vars in migrations/env.py
# NOTE: keep this file ASCII-only (configparser uses locale encoding on Windows)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
